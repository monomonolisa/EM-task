<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial, sans-serif" font-size="12">
  
  <!-- Заголовок -->
  <text x="400" y="25" font-size="18" font-weight="bold" fill="#333">BPMN Диаграмма: Публикация товара на маркетплейсе</text>
  
  <!-- Разделительные линии для дорожек (Swimlanes) -->
  <!-- Продавец (0-250) -->
  <rect x="10" y="40" width="1180" height="200" fill="#E8F4FD" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="65" font-weight="bold" fill="#0066CC">Продавец (Seller)</text>
  
  <!-- Система (250-520) -->
  <rect x="10" y="240" width="1180" height="200" fill="#E8FDE8" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="265" font-weight="bold" fill="#008800">Система маркетплейса (System)</text>
  
  <!-- Модератор (520-700) -->
  <rect x="10" y="440" width="1180" height="180" fill="#FDF4E8" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="465" font-weight="bold" fill="#CC6600">Модератор (Moderator)</text>

  <!-- ===== НАЧАЛО ===== -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="#333" stroke-width="2"/>
  <text x="92" y="105" font-size="14">●</text>

  <!-- Start -> Перейти в Мои товары -->
  <line x1="115" y1="100" x2="180" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="80" width="130" height="40" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="105" font-size="11">Перейти в Мои товары</text>

  <!-- -> Добавить товар -->
  <line x1="310" y1="100" x2="370" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="80" width="130" height="40" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="380" y="105" font-size="11">Нажать Добавить товар</text>

  <!-- -> Заполнить поля -->
  <line x1="500" y1="100" x2="560" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="80" width="140" height="40" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="570" y="105" font-size="11">Заполнить поля</text>

  <!-- Гейтвей: Отправить vs Черновик -->
  <line x1="700" y1="100" x2="760" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="780,85 800,100 780,115 760,100" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- ===== Путь 1: Отправить на публикацию ===== -->
  <text x="765" y="70" font-size="10" fill="#008800">Отправить</text>
  <line x1="800" y1="100" x2="860" y2="100" stroke="#008800" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="860" y="80" width="140" height="40" rx="8" fill="#E8FDE8" stroke="#008800" stroke-width="1.5"/>
  <text x="870" y="105" font-size="11">Отправить</text>

  <!-- Переход к системе -->
  <line x1="1000" y1="100" x2="1050" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Путь 2: Черновик ===== -->
  <text x="765" y="130" font-size="10" fill="#CC6600">Черновик</text>
  <line x1="800" y1="115" x2="800" y2="155" stroke="#CC6600" stroke-width="1.5"/>
  <line x1="800" y1="155" x2="860" y2="155" stroke="#CC6600" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <rect x="860" y="135" width="140" height="40" rx="8" fill="#FDF4E8" stroke="#CC6600" stroke-width="1.5"/>
  <text x="870" y="160" font-size="11">Черновик</text>

  <!-- Конец черновика -->
  <line x1="1000" y1="155" x2="1050" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#arrowEnd)"/>
  <circle cx="1070" cy="155" r="10" fill="#333" stroke="#333" stroke-width="1.5"/>

  <!-- ===== СИСТЕМА: Проверка данных ===== -->
  <rect x="100" y="280" width="150" height="50" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="115" y="310" font-size="12">Проверка данных</text>

  <line x1="115" y1="120" x2="115" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Гейтвей валидации -->
  <line x1="250" y1="305" x2="300" y2="305" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="320,290 340,305 320,320 300,305" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Ветка: Ошибки валидации -->
  <text x="305" y="340" font-size="10" fill="#CC0000">есть ошибки</text>
  <line x1="320" y1="320" x2="320" y2="360" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="320" y1="360" x2="390" y2="360" stroke="#CC0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="390" y="340" width="150" height="40" rx="8" fill="#FFEEEE" stroke="#CC0000" stroke-width="1.5"/>
  <text x="400" y="360" font-size="11">Подсветить поля ошибок</text>

  <!-- Возврат к продавцу -->
  <line x1="540" y1="360" x2="1100" y2="360" stroke="#CC0000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="1100" y1="360" x2="1100" y2="120" stroke="#CC0000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="1100" y1="120" x2="1000" y2="120" stroke="#CC0000" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="1080" y="240" font-size="10" fill="#CC0000">исправление ошибок</text>

  <!-- Ветка: Ошибок нет -> Сохранить и отправить на модерацию -->
  <text x="305" y="285" font-size="10" fill="#008800">ошибок нет</text>
  <line x1="340" y1="290" x2="400" y2="290" stroke="#008800" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="400" y="265" width="170" height="50" rx="8" fill="#E8FDE8" stroke="#008800" stroke-width="1.5"/>
  <text x="410" y="285" font-size="11">Сохранить товар</text>
  <text x="410" y="300" font-size="11">Статус: На модерации</text>

  <!-- Отправка модератору -->
  <line x1="570" y1="290" x2="650" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="265" width="160" height="50" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="660" y="285" font-size="11">Отправить</text>
  <text x="660" y="300" font-size="11">модератору</text>

  <!-- Переход к модератору -->
  <line x1="330" y1="315" x2="330" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== МОДЕРАТОР ===== -->
  <rect x="180" y="470" width="160" height="50" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="490" font-size="11">Проверить</text>
  <text x="190" y="505" font-size="11">по правилам площадки</text>

  <!-- Гейтвей модерации -->
  <line x1="340" y1="495" x2="390" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="410,480 430,495 410,510 390,495" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Одобрение -->
  <text x="395" y="535" font-size="10" fill="#008800">одобрить</text>
  <line x1="410" y1="510" x2="410" y2="550" stroke="#008800" stroke-width="1.5"/>
  <line x1="410" y1="550" x2="480" y2="550" stroke="#008800" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="480" y="530" width="130" height="40" rx="8" fill="#E8FDE8" stroke="#008800" stroke-width="1.5"/>
  <text x="490" y="555" font-size="11">Одобрить</text>

  <!-- Отклонение -->
  <text x="395" y="475" font-size="10" fill="#CC0000">отклонить</text>
  <line x1="430" y1="480" x2="480" y2="460" stroke="#CC0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="480" y="440" width="150" height="40" rx="8" fill="#FFEEEE" stroke="#CC0000" stroke-width="1.5"/>
  <text x="490" y="460" font-size="11">Отклонить</text>
  <text x="490" y="472" font-size="10">+ комментарий</text>

  <!-- Статус Отклонен -->
  <line x1="630" y1="460" x2="680" y2="460" stroke="#CC0000" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="680" y="440" width="130" height="40" rx="8" fill="#FFEEEE" stroke="#CC0000" stroke-width="1.5"/>
  <text x="690" y="460" font-size="11">Статус: Отклонен</text>

  <!-- Уведомление продавца -->
  <line x1="630" y1="550" x2="680" y2="550" stroke="#008800" stroke-width="1.5"/>
  <rect x="680" y="530" width="150" height="40" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="690" y="555" font-size="11">Уведомить продавца</text>

  <!-- Переход обратно к продавцу для исправления -->
  <line x1="810" y1="460" x2="900" y2="460" stroke="#CC0000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="900" y1="460" x2="900" y2="110" stroke="#CC0000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="900" y1="110" x2="860" y2="110" stroke="#333" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowEnd)"/>
  <text x="870" y="280" font-size="10" fill="#CC0000">редактирование</text>

  <!-- Переход при одобрении -->
  <line x1="610" y1="550" x2="650" y2="650" stroke="#333" stroke-width="1.5"/>

  <!-- ===== СИСТЕМА (вторая часть) ===== -->
  <rect x="650" y="650" width="160" height="50" rx="8" fill="#E8FDE8" stroke="#008800" stroke-width="1.5"/>
  <text x="660" y="670" font-size="11">Изменить статус</text>
  <text x="660" y="685" font-size="11">на «Опубликован»</text>

  <line x1="810" y1="675" x2="860" y2="675" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="860" y="655" width="150" height="40" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="870" y="680" font-size="11">Показать на витрине</text>

  <line x1="1010" y1="675" x2="1060" y2="675" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1060" y="655" width="130" height="40" rx="8" fill="#FAFAFA" stroke="#333" stroke-width="1.5"/>
  <text x="1070" y="680" font-size="11">Уведомить</text>

  <!-- КОНЕЦ -->
  <line x1="1190" y1="675" x2="1140" y2="675" stroke="#333" stroke-width="1.5" marker-end="url(#arrowEnd)"/>
  <circle cx="1120" cy="675" r="10" fill="#333" stroke="#333" stroke-width="1.5"/>

  <!-- Исключение: Система недоступна -->
  <rect x="850" y="200" width="180" height="40" rx="8" fill="#FFEEEE" stroke="#CC0000" stroke-width="1.5"/>
  <text x="860" y="215" font-size="10" fill="#CC0000">Система недоступна</text>
  <text x="860" y="230" font-size="10">Показать ошибку</text>
  
  <line x1="940" y1="220" x2="980" y2="155" stroke="#333" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowEnd)"/>
  <text x="950" y="185" font-size="9" fill="#666">исключение</text>

  <!-- Легенда -->
  <rect x="20" y="780" width="600" height="90" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="30" y="800" font-weight="bold" font-size="13">Легенда</text>
  
  <rect x="30" y="810" width="30" height="15" rx="4" fill="#FAFAFA" stroke="#333" stroke-width="1"/>
  <text x="70" y="823" font-size="10">Task (задача)</text>
  
  <polygon points="120,810 130,817 120,825 110,817" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="140" y="823" font-size="10">Gateway (шлюз)</text>
  
  <circle cx="220" cy="817" r="8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="823" font-size="10">Start / End event</text>

  <rect x="350" y="810" width="30" height="15" rx="4" fill="#E8FDE8" stroke="#008800" stroke-width="1"/>
  <text x="390" y="823" font-size="10">Успешный путь</text>

  <rect x="500" y="810" width="30" height="15" rx="4" fill="#FFEEEE" stroke="#CC0000" stroke-width="1"/>
  <text x="540" y="823" font-size="10">Ошибка / Отклонение</text>

</svg>
